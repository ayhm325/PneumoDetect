<!doctype html>
<html lang="ar" dir="rtl" class="dark" data-theme="forest">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111713" />
    <meta
      name="description"
      content="PneumoDetect — AI-assisted chest X-ray analysis, medical records, and a doctor–patient portal."
    />
    <title>PneumoDetect — AI-assisted chest X-ray analysis</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("pd-theme");
          var clay = t === "clay" || t === "light";
          var r = document.documentElement;
          r.classList.remove("light", "dark");
          r.classList.add(clay ? "light" : "dark");
          r.setAttribute("data-theme", clay ? "clay" : "forest");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
