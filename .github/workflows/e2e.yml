name: E2E Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  e2e:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: detect
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      AI_USE_MOCK: "true"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/detect
      JWT_SECRET: ci-e2e-jwt-secret-key-at-least-32-characters
      PW_BASE_URL: http://localhost:5173
      PW_STORAGE_STATE: playwright/.auth/patient.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Wait for Postgres
        run: |
          for i in {1..60}; do
            pg_isready -h localhost -p 5432 && exit 0 || sleep 1
          done
          echo "Postgres did not become ready" && exit 1

      - name: Push Prisma schema to DB
        run: npx prisma db push --schema=prisma/schema.prisma

      - name: Generate Prisma client
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Seed database for E2E
        run: node apps/api/prisma/seed.cjs

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start API and Web servers
        run: |
          nohup npm run dev:api > /tmp/api.log 2>&1 &
          nohup npm run dev:web > /tmp/web.log 2>&1 &
          for i in {1..60}; do
            curl -sf http://localhost:4000/api/health > /dev/null && curl -sf http://localhost:5173 > /dev/null && exit 0
            sleep 2
          done
          echo "Servers did not become ready"
          cat /tmp/api.log || true
          cat /tmp/web.log || true
          exit 1
        shell: bash

      - name: Generate Playwright storage state
        run: node playwright/generate-storage-state.mjs

      - name: Run E2E Test
        run: npx playwright test playwright-tests/analysis-e2e.spec.js --project=chromium

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-artifacts
          path: |
            playwright-report/
            test-results/
            /tmp/api.log
            /tmp/web.log
          retention-days: 7
